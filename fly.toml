app = "upmetrics"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATABASE_PATH = "/data/upmetrics.db"
  AUTH_BASE_URL = "https://upmetrics.org"

[[mounts]]
  source = "upmetrics_data"
  destination = "/data"

# Memory has been bumped twice chasing a flap (256→512→1024) but RAM was only
# ever the symptom. Real root cause (2026-07-05): a chatty project (buddy, ~97%
# of events → DB at 750MB) + the correlation worker's per-project queries lacking
# a (project_id, received_at) / (project_id, release, received_at) index → it
# ROW-SCANNED ~218k rows every 30s. Warm that's ~0.5s; on a COLD cache (overnight
# idle) it read those rows from disk → 16-35s → froze the sync event loop →
# /health timeout → deadman page. Fixed at the root by migration 0014 (composite
# indexes → the scans are now index seeks). 2GB stays as comfortable headroom for
# the 750MB DB, not as the fix. Single source of truth so a deploy never reverts
# the memory. See docs/adr/0001.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Tolerant of brief event-loop stalls so a transient hiccup doesn't drop the
  # SINGLE instance from tcp/443 (→ user-facing 503). Paired with the
  # wal_autocheckpoint=0 fix (db/index.ts) that removes the long writer-inline
  # checkpoint stalls behind the 2026-06-02 flap. See docs/adr/0001.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

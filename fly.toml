app = "upmetrics"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DATABASE_PATH = "/data/upmetrics.db"
  AUTH_BASE_URL = "https://upmetrics.org"

[[mounts]]
  source = "upmetrics_data"
  destination = "/data"

# 256MB ran with ~7MB free (bun + sqlite page-cache + Litestream fill the box),
# so any spike — a */5 probe burst, a Tigris S3 latency blip — starved memory →
# event-loop freeze → health-check timeout → user-facing 503. 512MB gave real
# slack — until the DB grew to ~380MB (30-day retention across 11 fleet
# projects, buddy alone ~95% of events): MemFree back down to ~5.5MB, 320k+
# major page faults, same freeze → flap pattern recurring (2026-07-01). 1GB
# gives real headroom again. Single source of truth so a deploy never reverts
# the memory. See docs/adr/0001 (2026-06-02 flap postmortem).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  # Tolerant of brief event-loop stalls so a transient hiccup doesn't drop the
  # SINGLE instance from tcp/443 (→ user-facing 503). Paired with the
  # wal_autocheckpoint=0 fix (db/index.ts) that removes the long writer-inline
  # checkpoint stalls behind the 2026-06-02 flap. See docs/adr/0001.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

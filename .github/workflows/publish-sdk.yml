name: publish-sdk

# Publishes @upmetrics/sdk to npm via OIDC Trusted Publishing — NO token/secret.
# Triggers:
#   • push a tag matching sdk-v*  (e.g. sdk-v0.1.1)  → publishes that commit
#   • manual run (Actions → publish-sdk → Run workflow)
#
# PREREQUISITE (one-time): the package must already exist on npm AND have a
# Trusted Publisher configured at npmjs.com → @upmetrics/sdk → Settings →
# Trusted Publisher = broberg-ai/upmetrics, workflow `publish-sdk.yml`.
# npm has no "pending publisher", so v0.1.0 is bootstrapped once by hand;
# every publish after that runs here with zero secrets (OIDC + provenance).

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@v4

      # Version from root package.json "packageManager" (pnpm@10.x) — no
      # `version:` input, or action-setup errors "Multiple versions specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # resolves to >=22.14, required by OIDC publishing
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm CLI >= 11.5.1; node 22 still ships 10.x.
      # PIN 11.5.1 exactly — npm@latest now resolves to v12, which breaks
      # `npm publish --provenance` with "Cannot find module 'sigstore'" (fleet-wide
      # CI break flagged by components 2026-07-10). Don't float back to @latest.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @upmetrics/sdk build

      - name: Guard — version not already on npm
        run: |
          PKG_VER=$(node -p "require('./packages/sdk/package.json').version")
          if npm view "@upmetrics/sdk@$PKG_VER" version >/dev/null 2>&1; then
            echo "::error::@upmetrics/sdk@$PKG_VER already published — bump the version first."
            exit 1
          fi
          echo "Publishing @upmetrics/sdk@$PKG_VER"

      # npm (not pnpm) does the OIDC token exchange + provenance. No NODE_AUTH_TOKEN.
      - name: Publish (OIDC)
        run: npm publish --access public --provenance
        working-directory: packages/sdk
